name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, muse]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: set Cesium ion token (Worker secret)
        run: |
          test -n "$CESIUM_ION_TOKEN" || { echo "::error::Actions secret CESIUM_ION_TOKEN is missing"; exit 1; }
          printf '%s' "$CESIUM_ION_TOKEN" | npx wrangler secret put CESIUM_ION_TOKEN
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: curl -fsS -o /dev/null https://xiaoxin.liming-work.com/
      - name: check live config + photoreal assets
        run: |
          url=https://xiaoxin.liming-work.com
          curl -fsS -o /dev/null "$url/vendor/cesium/Cesium.js"
          curl -fsS -o /dev/null "$url/photoreal.js"
          ok=""
          for i in 1 2 3 4 5 6; do
            if curl -fsS -H 'Cache-Control: no-cache' "$url/config.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let j;try{j=JSON.parse(s)}catch(e){process.exit(1)}if(typeof j.cesiumIonToken!=="string"||!j.cesiumIonToken){console.error("config.json: cesiumIonToken is null");process.exit(1)}console.log("config.json: token present")})'; then ok=1; break; fi
            sleep 5
          done
          test -n "$ok"
