name = "xiaoxin-site"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [ { pattern = "xiaoxin.liming-work.com", custom_domain = true } ]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Staging: separate Worker on workers.dev, no custom domain. Deployed from non-main branches.
[env.staging]
name = "xiaoxin-site-staging"
workers_dev = true
routes = []
