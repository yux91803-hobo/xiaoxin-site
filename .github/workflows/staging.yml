name: staging
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  staging:
    runs-on: [self-hosted, muse]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test
      - id: deploy
        run: |
          npx wrangler deploy --env staging 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staging URL: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: set Cesium ion token (Worker secret)
        run: |
          test -n "$CESIUM_ION_TOKEN" || { echo "::error::Actions secret CESIUM_ION_TOKEN is missing"; exit 1; }
          printf '%s' "$CESIUM_ION_TOKEN" | npx wrangler secret put CESIUM_ION_TOKEN --env staging
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: smoke test
        run: |
          url="${{ steps.deploy.outputs.url }}"
          test -n "$url"
          for i in 1 2 3 4 5 6; do curl -fsS "$url/" -o page.html && break; sleep 5; done
          grep -q 'vendor/three.module.js' page.html
          curl -fsS -o /dev/null "$url/vendor/three.module.js"
          curl -fsS -o /dev/null "$url/textures/earth-blue-marble.jpg"
          grep -q 'id="scene"' page.html
          grep -q 'id="cardReal"' page.html
          curl -fsS -o /dev/null "$url/photoreal.js"
          curl -fsS -o /dev/null "$url/vendor/cesium/Cesium.js"
          curl -fsS -o /dev/null "$url/vendor/cesium/Widgets/widgets.css"
          curl -fsS -o /dev/null "$url/vendor/cesium/Workers/decodeDraco.js"
          ok=""
          for i in 1 2 3 4 5 6; do
            if curl -fsS -H 'Cache-Control: no-cache' "$url/config.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let j;try{j=JSON.parse(s)}catch(e){process.exit(1)}if(typeof j.cesiumIonToken!=="string"||!j.cesiumIonToken){console.error("config.json: cesiumIonToken is null");process.exit(1)}console.log("config.json: token present")})'; then ok=1; break; fi
            sleep 5
          done
          test -n "$ok"
          curl -fsSI "$url/config.json" | grep -qi '^cache-control: no-store'
          echo "OK $url"
