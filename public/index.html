<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xiaoxin · 地球</title>
<meta name="description" content="可旋转的 3D 地球仪，点击发光标记飞往世界各地。">
<meta name="theme-color" content="#03050c">
<style>
  :root{
    --bg:#03050c; --ink:#e8eefc; --muted:rgba(232,238,252,.62); --faint:rgba(232,238,252,.32);
    --glass:rgba(14,20,38,.46); --line:rgba(160,190,255,.14); --accent:#7cc4ff; --warm:#ffcf8a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  #scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab;touch-action:none;outline:none}
  #scene.dragging{cursor:grabbing}
  #scene.hovering{cursor:pointer}

  /* soft vignette for atmosphere */
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(2,3,8,.55) 80%,rgba(1,2,5,.9) 100%)}

  .brand{position:fixed;top:calc(22px + env(safe-area-inset-top));left:28px;pointer-events:none;user-select:none}
  .brand h1{margin:0;font-weight:300;letter-spacing:.42em;font-size:13px;text-transform:uppercase;color:var(--muted)}
  .brand p{margin:6px 0 0;font-size:22px;font-weight:500;letter-spacing:.02em}

  .panel{position:fixed;top:50%;right:24px;transform:translateY(-50%);width:270px;max-height:76vh;
    display:flex;flex-direction:column;border-radius:20px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden;
    transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1)}
  .panel header{padding:18px 20px 10px;font-size:11px;letter-spacing:.3em;color:var(--faint);text-transform:uppercase}
  .panel ul{list-style:none;margin:0;padding:4px 8px 12px;overflow:auto;scrollbar-width:none}
  .panel ul::-webkit-scrollbar{display:none}
  .panel li button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;
    padding:11px 12px;border-radius:12px;cursor:pointer;transition:background .25s ease}
  .panel li button:hover,.panel li button:focus-visible{background:rgba(124,196,255,.08)}
  .panel li button.active{background:rgba(124,196,255,.14)}
  .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));
    box-shadow:0 0 10px 2px var(--c,var(--accent))}
  .pl-name{font-size:14px;font-weight:500}
  .pl-sub{font-size:11.5px;color:var(--muted);margin-top:2px}

  .card{position:fixed;left:28px;bottom:calc(28px + env(safe-area-inset-bottom));width:min(360px,calc(100vw - 56px));
    padding:20px 22px;border-radius:20px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 30px 80px rgba(0,0,0,.45);opacity:0;transform:translateY(16px);pointer-events:none;
    transition:opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1)}
  .card.show{opacity:1;transform:none;pointer-events:auto}
  .card .k{font-size:11px;letter-spacing:.28em;color:var(--faint);text-transform:uppercase}
  .card h2{margin:6px 0 2px;font-size:24px;font-weight:500}
  .card .coord{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .card p{margin:12px 0 0;font-size:13.5px;line-height:1.65;color:rgba(232,238,252,.82)}
  .card .x{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;
    display:grid;place-items:center;color:var(--muted);transition:background .2s}
  .card .x{position:absolute;top:14px;right:14px}
  .card .x:hover{background:rgba(255,255,255,.08)}

  .tip{position:fixed;left:0;top:0;padding:6px 10px;border-radius:8px;font-size:12px;pointer-events:none;
    background:rgba(8,12,24,.8);border:1px solid var(--line);opacity:0;transition:opacity .15s;white-space:nowrap}

  .hint{position:fixed;right:28px;bottom:calc(24px + env(safe-area-inset-bottom));font-size:11.5px;color:var(--faint);
    letter-spacing:.06em;pointer-events:none;transition:opacity 1s}
  .ctrl{position:fixed;top:calc(22px + env(safe-area-inset-top));right:24px;display:flex;gap:8px}
  .ctrl button{all:unset;cursor:pointer;height:34px;padding:0 14px;border-radius:17px;font-size:12px;color:var(--muted);
    background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:color .2s, background .2s}
  .ctrl button:hover{color:var(--ink);background:rgba(30,40,70,.6)}
  .ctrl button[aria-pressed="true"]{color:var(--accent)}

  .loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:10;transition:opacity 1.2s ease}
  .loader.done{opacity:0;pointer-events:none}
  .loader span{font-size:11px;letter-spacing:.5em;color:var(--faint);text-transform:uppercase;animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.35}}

  @media (max-width:760px){
    .panel{top:auto;bottom:calc(16px + env(safe-area-inset-bottom));right:12px;left:12px;transform:none;width:auto;max-height:none;border-radius:18px}
    .panel header{display:none}
    .panel ul{display:flex;gap:4px;overflow-x:auto;padding:8px}
    .panel li button{width:auto;white-space:nowrap;padding:9px 12px}
    .pl-sub{display:none}
    .card{bottom:calc(92px + env(safe-area-inset-bottom));left:12px;width:calc(100vw - 24px)}
    .hint{display:none}
    .brand{left:18px}
    .brand p{font-size:18px}
    .ctrl{right:12px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three.module.js",
  "three/addons/controls/OrbitControls.js": "/vendor/OrbitControls.js"
} }
</script>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="3D 地球仪，可拖动旋转"></canvas>
<div class="vignette"></div>

<div class="brand"><h1>Xiaoxin</h1><p>看看这个世界</p></div>

<div class="ctrl">
  <button id="btnSpin" aria-pressed="true" title="自动旋转">自转</button>
  <button id="btnReset" title="回到全景">全景</button>
</div>

<nav class="panel" aria-label="精选地点"><header>精选地点</header><ul id="list"></ul></nav>

<section class="card" id="card" aria-live="polite">
  <button class="x" id="cardClose" aria-label="关闭">✕</button>
  <div class="k" id="cardRegion"></div>
  <h2 id="cardName"></h2>
  <div class="coord" id="cardCoord"></div>
  <p id="cardDesc"></p>
</section>

<div class="tip" id="tip"></div>
<div class="hint" id="hint">拖动旋转 · 滚轮缩放 · 点击光点飞过去</div>
<div class="loader" id="loader"><span id="loaderText">Loading Earth</span></div>
<script>
  // surface failures instead of hanging on the loader
  function showFatal(msg){var l=document.getElementById("loader"),t=document.getElementById("loaderText");if(!l||!t)return;l.classList.remove("done");t.style.animation="none";t.style.letterSpacing=".08em";t.style.textTransform="none";t.style.fontSize="14px";t.style.color="rgba(232,238,252,.75)";t.style.textAlign="center";t.style.padding="0 24px";t.textContent=msg;}
  window.addEventListener("error",function(e){if(!window.__globeReady)showFatal("地球加载出错了，请刷新重试。");});
  setTimeout(function(){if(!window.__globeStarted)showFatal("地球没能启动，可能是浏览器不支持 WebGL 或网络较慢，请刷新重试。");},15000);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TEX = '/textures/';
const R = 1;                     // globe radius
const HOME_DIST = 3.2;           // default camera distance
const FOCUS_DIST = 2.15;         // distance when focused on a place
const IDLE_RESUME_MS = 4000;     // auto-rotate resumes after this long without interaction

const PLACES = [
  { id:'beijing',   name:'北京',       region:'中国',     lat:39.9042, lon:116.4074, color:'#ffcf8a', desc:'故宫的红墙与胡同的灰瓦，三千年的城，一年四季都有自己的颜色。' },
  { id:'shanghai',  name:'上海',       region:'中国',     lat:31.2304, lon:121.4737, color:'#ffb37a', desc:'外滩一边是百年万国建筑，一边是陆家嘴的天际线，黄浦江把它们隔开又连在一起。' },
  { id:'tokyo',     name:'东京',       region:'日本',     lat:35.6762, lon:139.6503, color:'#ff8fb1', desc:'霓虹与神社并存的城市，凌晨的便利店和清晨的筑地一样迷人。' },
  { id:'reykjavik', name:'雷克雅未克', region:'冰岛',     lat:64.1466, lon:-21.9426, color:'#8affd6', desc:'世界最北的首都之一，冬夜抬头就可能撞见极光。' },
  { id:'paris',     name:'巴黎',       region:'法国',     lat:48.8566, lon:2.3522,   color:'#c9a2ff', desc:'塞纳河左岸的书店、右岸的咖啡馆，铁塔每到整点会闪烁五分钟。' },
  { id:'cairo',     name:'开罗',       region:'埃及',     lat:30.0444, lon:31.2357,  color:'#ffd37a', desc:'尼罗河畔的古老都城，吉萨金字塔就在城市边缘静静站了四千五百年。' },
  { id:'capetown',  name:'开普敦',     region:'南非',     lat:-33.9249,lon:18.4241,  color:'#7cffb2', desc:'桌山的平顶被云铺成“桌布”，两大洋在好望角附近交汇。' },
  { id:'newyork',   name:'纽约',       region:'美国',     lat:40.7128, lon:-74.0060, color:'#7cc4ff', desc:'不眠之城。中央公园是曼哈顿钢铁森林中间的一大片绿。' },
  { id:'sf',        name:'旧金山',     region:'美国',     lat:37.7749, lon:-122.4194,color:'#ff9f7a', desc:'金门大桥常常藏在雾里，坡道上的叮当车一路开向海湾。' },
  { id:'rio',       name:'里约热内卢', region:'巴西',     lat:-22.9068,lon:-43.1729, color:'#ffe27a', desc:'基督像张开双臂俯瞰海湾，科帕卡巴纳海滩的浪声昼夜不停。' },
  { id:'sydney',    name:'悉尼',       region:'澳大利亚', lat:-33.8688,lon:151.2093, color:'#7ad8ff', desc:'歌剧院的白色风帆与港湾大桥，是南半球最好认的海港。' },
  { id:'machu',     name:'马丘比丘',   region:'秘鲁',     lat:-13.1631,lon:-72.5450, color:'#a6ff7a', desc:'安第斯山脊上的印加古城，清晨云雾散开时最动人。' },
];

/* ---------- list (built first so the UI works even if WebGL fails) ---------- */
const listEl = document.getElementById('list');
PLACES.forEach((pl, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<button data-i="${i}"><span class="dot" style="--c:${pl.color}"></span><span><div class="pl-name">${pl.name}</div><div class="pl-sub">${pl.region} · ${fmt(pl.lat,'N','S')} ${fmt(pl.lon,'E','W')}</div></span></button>`;
  li.querySelector('button').addEventListener('click', () => select(i));
  listEl.appendChild(li);
});
function fmt(v, p, n){ return `${Math.abs(v).toFixed(2)}°${v >= 0 ? p : n}`; }

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('scene');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, powerPreference:'high-performance' }); }
catch (err) { showFatal('你的浏览器或设备暂不支持 WebGL，无法显示 3D 地球。'); throw err; }
window.__globeStarted = true;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.setClearColor(0x03050c, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x03050c, 0.035);
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.01, 200);
camera.position.set(0, 0.9, HOME_DIST).setLength(HOME_DIST);

/* soft lighting */
scene.add(new THREE.AmbientLight(0x8fa6ff, 0.55));
scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x0a0f20, 0.35));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.1);
sun.position.set(-4, 2.2, 3.5);
scene.add(sun);
const rim = new THREE.DirectionalLight(0x6fa8ff, 0.6);
rim.position.set(4, -1, -3);
scene.add(rim);

/* ---------- globe ---------- */
const world = new THREE.Group();
world.rotation.y = -Math.PI / 2;  // start over Asia-ish
scene.add(world);

const loader = new THREE.TextureLoader();
loader.setCrossOrigin('anonymous');
const load = (f, srgb) => new Promise(res => loader.load(TEX + f, t => { if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); res(t); }, undefined, () => res(null)));

const earthMat = new THREE.MeshPhongMaterial({ color:0x2a4d7a, shininess:18, specular:new THREE.Color(0x2b3b55) });
const earth = new THREE.Mesh(new THREE.SphereGeometry(R, 128, 128), earthMat);
world.add(earth);

// city lights on the night side (additive, masked by sun direction in shader)
const nightUniforms = { uNight:{ value:null }, uSunDir:{ value:new THREE.Vector3() }, uStrength:{ value:0 } };
const nightMat = new THREE.ShaderMaterial({
  uniforms: nightUniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`varying vec2 vUv; varying vec3 vN; void main(){ vUv=uv; vN=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`uniform sampler2D uNight; uniform vec3 uSunDir; uniform float uStrength; varying vec2 vUv; varying vec3 vN;
    void main(){ float d=dot(normalize(vN),normalize(uSunDir)); float dark=smoothstep(0.15,-0.35,d);
      vec3 c=texture2D(uNight,vUv).rgb; c=pow(c,vec3(1.4))*vec3(1.0,0.82,0.55)*2.2; gl_FragColor=vec4(c*dark*uStrength,1.0);} `
});
const nightMesh = new THREE.Mesh(new THREE.SphereGeometry(R * 1.0015, 128, 128), nightMat);
world.add(nightMesh);

// atmosphere glow (fresnel, back side)
const atmo = new THREE.Mesh(new THREE.SphereGeometry(R * 1.17, 96, 96), new THREE.ShaderMaterial({
  side:THREE.BackSide, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`varying vec3 vN; varying vec3 vV; void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`varying vec3 vN; varying vec3 vV; void main(){ float f=-dot(vN,vV); float i=pow(smoothstep(0.0,0.56,f),2.4); gl_FragColor=vec4(vec3(0.33,0.62,1.0)*i*1.25, i*0.9); }`
}));
scene.add(atmo);
// thin inner haze on the limb
const haze = new THREE.Mesh(new THREE.SphereGeometry(R * 1.004, 96, 96), new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`varying vec3 vN; varying vec3 vV; void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`varying vec3 vN; varying vec3 vV; void main(){ float f=pow(1.0-max(dot(vN,vV),0.0),3.0); gl_FragColor=vec4(vec3(0.45,0.7,1.0)*f*0.9, f); }`
}));
scene.add(haze);

/* ---------- stars ---------- */
function makeStars(n, rMin, rMax, size, op){
  const g = new THREE.BufferGeometry(), p = new Float32Array(n*3), c = new Float32Array(n*3);
  const tint = [new THREE.Color(0xffffff), new THREE.Color(0xbcd4ff), new THREE.Color(0xffe2c4)];
  for (let i=0;i<n;i++){
    const v = new THREE.Vector3().randomDirection().multiplyScalar(rMin + Math.random()*(rMax-rMin));
    p.set([v.x,v.y,v.z], i*3);
    const t = tint[(Math.random()*3)|0]; const b = .5 + Math.random()*.5; c.set([t.r*b,t.g*b,t.b*b], i*3);
  }
  g.setAttribute('position', new THREE.BufferAttribute(p,3)); g.setAttribute('color', new THREE.BufferAttribute(c,3));
  return new THREE.Points(g, new THREE.PointsMaterial({ size, sizeAttenuation:true, vertexColors:true, transparent:true, opacity:op, depthWrite:false, fog:false }));
}
const stars1 = makeStars(2600, 40, 90, 0.12, 0.9), stars2 = makeStars(900, 30, 60, 0.22, 0.55);
scene.add(stars1, stars2);

/* ---------- markers ---------- */
function latLonToVec3(lat, lon, r){
  const phi = (90 - lat) * Math.PI / 180, th = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(th), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(th));
}
function glowTexture(){
  const s = 128, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.18,'rgba(255,255,255,.85)');
  gr.addColorStop(.42,'rgba(255,255,255,.22)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,s,s);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = glowTexture();
const ringGeo = new THREE.RingGeometry(0.8, 1, 48);
const markers = [];  // { place, group, glow, core, ring, ringMat, hit }
const hitTargets = [];

PLACES.forEach((pl, i) => {
  const col = new THREE.Color(pl.color);
  const pos = latLonToVec3(pl.lat, pl.lon, R);
  const normal = pos.clone().normalize();
  const g = new THREE.Group();
  g.position.copy(pos);
  g.lookAt(pos.clone().multiplyScalar(2));  // +z faces outward
  world.add(g);

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, color:col, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending }));
  glow.scale.setScalar(0.11); glow.position.z = 0.006; g.add(glow);

  const core = new THREE.Mesh(new THREE.SphereGeometry(0.0085, 16, 16), new THREE.MeshBasicMaterial({ color:col.clone().lerp(new THREE.Color(0xffffff), .5) }));
  core.position.z = 0.004; g.add(core);

  const ringMat = new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:.8, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending });
  const ring = new THREE.Mesh(ringGeo, ringMat); ring.position.z = 0.002; ring.scale.setScalar(0.02); g.add(ring);

  // light beam
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.0012, 0.0035, 0.09, 8, 1, true),
    new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:.55, depthWrite:false, blending:THREE.AdditiveBlending }));
  beam.rotation.x = Math.PI/2; beam.position.z = 0.045; g.add(beam);

  // invisible, larger hit area
  const hit = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), new THREE.MeshBasicMaterial({ visible:false }));
  hit.userData.index = i; g.add(hit); hitTargets.push(hit);

  markers.push({ place:pl, group:g, glow, core, ring, ringMat, beam, normal, phase:Math.random()*Math.PI*2, focus:0 });
});

/* ---------- controls ---------- */
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 1.45; controls.maxDistance = 6;
controls.rotateSpeed = 0.5; controls.zoomSpeed = 0.7;
controls.autoRotate = true; controls.autoRotateSpeed = 0.45;

let intro = { t0:0, done:false };
let autoSpin = true;           // user preference (toggle)
let lastInteract = -Infinity;
let interacting = false;
const pauseRotation = () => { lastInteract = performance.now(); controls.autoRotate = false; };
controls.addEventListener('start', () => { interacting = true; intro.done = true; pauseRotation(); cancelFlight(); canvas.classList.add('dragging'); hideHint(); });
controls.addEventListener('end',   () => { interacting = false; lastInteract = performance.now(); canvas.classList.remove('dragging'); });

/* ---------- camera flights ---------- */
let flight = null;
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
function cancelFlight(){ flight = null; }
function flyTo(dir, dist, dur = 1800){
  const from = camera.position.clone();
  const fromLen = from.length(), toDir = dir.clone().normalize();
  const fromDir = from.clone().normalize();
  const angle = fromDir.angleTo(toDir);
  dur = Math.max(900, Math.min(2600, dur * (0.55 + angle / Math.PI)));
  // lift the camera a bit mid-flight for a cinematic arc
  const lift = Math.min(0.9, angle * 0.45);
  intro.done = true;
  flight = { fromDir, toDir, fromLen, toLen:dist, lift, t0:performance.now(), dur };
  pauseRotation();
}
function stepFlight(now){
  if (!flight) return;
  const k = Math.min(1, (now - flight.t0) / flight.dur), e = ease(k);
  const q = new THREE.Quaternion().setFromUnitVectors(flight.fromDir, flight.toDir);
  const qi = new THREE.Quaternion().slerp(q, e);
  const dir = flight.fromDir.clone().applyQuaternion(qi);
  if (flight.fromDir.dot(flight.toDir) < -0.999) { // antipodal: go over the pole
    dir.copy(flight.fromDir).lerp(new THREE.Vector3(0,1,0), Math.sin(e*Math.PI)).lerp(flight.toDir, e).normalize();
  }
  const len = THREE.MathUtils.lerp(flight.fromLen, flight.toLen, e) + Math.sin(e*Math.PI) * flight.lift;
  camera.position.copy(dir.multiplyScalar(len));
  camera.lookAt(controls.target);
  if (k >= 1) { flight = null; lastInteract = performance.now(); }
}

/* ---------- selection ---------- */
const card = document.getElementById('card');
let selected = -1;


function select(i){
  selected = i;
  const m = markers[i], pl = m.place;
  [...listEl.querySelectorAll('button')].forEach((b, j) => b.classList.toggle('active', j === i));
  listEl.querySelectorAll('button')[i].scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
  document.getElementById('cardRegion').textContent = pl.region;
  document.getElementById('cardName').textContent = pl.name;
  document.getElementById('cardCoord').textContent = `${fmt(pl.lat,'N','S')}  ·  ${fmt(pl.lon,'E','W')}`;
  document.getElementById('cardDesc').textContent = pl.desc;
  card.classList.add('show');
  world.updateMatrixWorld();
  const worldPos = m.group.getWorldPosition(new THREE.Vector3());
  // tilt the view slightly toward the equator so the marker sits a touch below center
  flyTo(worldPos.normalize(), FOCUS_DIST);
  hideHint();
  history.replaceState(null, '', '#' + pl.id);
}
function clearSelection(){
  selected = -1; card.classList.remove('show');
  listEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  history.replaceState(null, '', location.pathname);
}
document.getElementById('cardClose').addEventListener('click', clearSelection);
document.getElementById('btnReset').addEventListener('click', () => {
  clearSelection();
  const d = camera.position.clone().normalize(); d.y = 0.28; flyTo(d.normalize(), HOME_DIST, 1600);
});
const btnSpin = document.getElementById('btnSpin');
btnSpin.addEventListener('click', () => {
  autoSpin = !autoSpin; btnSpin.setAttribute('aria-pressed', String(autoSpin));
  if (!autoSpin) controls.autoRotate = false; else lastInteract = -Infinity;
});

/* ---------- picking / hover ---------- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const tip = document.getElementById('tip');
let downAt = null, hovered = -1;

function pick(e){
  const r = canvas.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects([earth, ...hitTargets], false);
  const eh = hits.find(h => h.object === earth), mh = hits.find(h => h.object !== earth);
  if (!mh) return -1;
  if (eh && mh.distance > eh.distance + 0.03) return -1;   // marker is behind the globe
  return mh.object.userData.index;
}
canvas.addEventListener('pointerdown', e => { downAt = { x:e.clientX, y:e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y); downAt = null;
  if (moved > 6) return;
  const i = pick(e); if (i >= 0) select(i);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || interacting) { tip.style.opacity = 0; return; }
  const i = pick(e); hovered = i;
  canvas.classList.toggle('hovering', i >= 0);
  if (i >= 0) { tip.textContent = `${PLACES[i].name} · ${PLACES[i].region}`; tip.style.transform = `translate(${e.clientX + 14}px, ${e.clientY + 12}px)`; tip.style.opacity = 1; }
  else tip.style.opacity = 0;
});
canvas.addEventListener('pointerleave', () => { tip.style.opacity = 0; hovered = -1; });
canvas.addEventListener('wheel', () => { pauseRotation(); cancelFlight(); hideHint(); }, { passive:true });
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') clearSelection();
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') select((selected + 1) % PLACES.length);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   select((selected - 1 + PLACES.length) % PLACES.length);
});

const hint = document.getElementById('hint');
let hintHidden = false;
function hideHint(){ if (!hintHidden){ hintHidden = true; hint.style.opacity = 0; } }

/* ---------- resize ---------- */
function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  camera.fov = w < 760 ? 52 : 42;   // a bit wider on phones so the globe fits
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize); onResize();

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const sunWorld = new THREE.Vector3();

function animate(){
  const now = performance.now(), t = clock.getElapsedTime();

  // resume auto-rotation after a quiet period
  if (autoSpin && !interacting && !flight && selected < 0 && now - lastInteract > IDLE_RESUME_MS) controls.autoRotate = true;
  if (selected >= 0 || !autoSpin) controls.autoRotate = false;

  stepFlight(now);
  if (!flight) controls.update();

  // keep the sun roughly over the viewer's left shoulder so the lit side faces us
  sunWorld.copy(camera.position).normalize().applyAxisAngle(new THREE.Vector3(0,1,0), 0.9).add(new THREE.Vector3(0,0.35,0)).normalize();
  sun.position.copy(sunWorld).multiplyScalar(5);
  nightUniforms.uSunDir.value.copy(sunWorld);

  // marker animation
  markers.forEach((m, i) => {
    const target = (i === selected ? 1 : 0) + (i === hovered ? .5 : 0);
    m.focus += (target - m.focus) * 0.08;
    const pulse = (t * 0.6 + m.phase / (Math.PI*2)) % 1;
    m.ring.scale.setScalar(0.012 + pulse * (0.05 + m.focus * 0.03));
    m.ringMat.opacity = (1 - pulse) * (0.7 + m.focus * 0.3);
    const breathe = 1 + Math.sin(t * 2.2 + m.phase) * 0.12;
    m.glow.scale.setScalar((0.1 + m.focus * 0.08) * breathe);
    m.beam.scale.set(1, 1 + m.focus * 1.4, 1);
    m.beam.position.z = 0.045 * (1 + m.focus * 1.4);
    // fade markers on the far side
    const facing = m.group.getWorldPosition(new THREE.Vector3()).normalize().dot(camera.position.clone().normalize());
    const vis = THREE.MathUtils.smoothstep(facing, -0.05, 0.25);
    m.glow.material.opacity = vis; m.beam.material.opacity = 0.55 * vis; m.ringMat.opacity *= vis;
  });

  stars1.rotation.y = t * 0.004; stars2.rotation.y = -t * 0.006;

  // intro: zoom in from afar
  if (!intro.done && intro.t0) {
    const k = Math.min(1, (now - intro.t0) / 2600), e = 1 - Math.pow(1 - k, 3);
    if (!flight && !interacting) camera.position.setLength(THREE.MathUtils.lerp(7, HOME_DIST, e));
    if (k >= 1) intro.done = true;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

/* ---------- boot ---------- */
(async () => {
  const [day, bump, water, night] = await Promise.all([
    load('earth-blue-marble.jpg', true), load('earth-topology.png'), load('earth-water.png'), load('earth-night.jpg', true)
  ]);
  if (day)   { earthMat.map = day; earthMat.color.set(0xffffff); }
  if (bump)  { earthMat.bumpMap = bump; earthMat.bumpScale = 3.5; }
  if (water) { earthMat.specularMap = water; earthMat.specular = new THREE.Color(0x4a6a8f); earthMat.shininess = 22; }
  earthMat.needsUpdate = true;
  if (night) { nightUniforms.uNight.value = night; nightUniforms.uStrength.value = 1; }

  camera.position.setLength(7);
  intro.t0 = performance.now();
  window.__globeReady = true;
  document.getElementById('loader').classList.add('done');

  const fromHash = PLACES.findIndex(p => '#' + p.id === location.hash);
  if (fromHash >= 0) setTimeout(() => select(fromHash), 1400);
})();
requestAnimationFrame(animate);
</script>
</body>
</html>
