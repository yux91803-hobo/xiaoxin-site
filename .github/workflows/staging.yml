name: staging
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
concurrency:
  group: staging
  cancel-in-progress: true
jobs:
  staging:
    runs-on: [self-hosted, muse]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - id: deploy
        run: |
          npx wrangler deploy --env staging 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staging URL: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: smoke test
        run: |
          url="${{ steps.deploy.outputs.url }}"
          test -n "$url"
          for i in 1 2 3 4 5 6; do curl -fsS "$url/" -o page.html && break; sleep 5; done
          grep -q 'three@0.170.0' page.html
          grep -q 'id="scene"' page.html
          echo "OK $url"
